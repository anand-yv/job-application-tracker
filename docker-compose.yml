name: job_tracker

services:
  postgres_db:
    image: postgres:16
    container_name: job-tracker-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "jobtracker"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

volumes:
  postgres_data:
