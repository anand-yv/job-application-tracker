spring:
  application:
    name: job-application-tracker

  datasource:
    url: jdbc:postgresql://localhost:5433/jobtracker # Port can be changed
    username: your_useraname
    password: your_password
    driver-class-name: org.postgresql.Driver # It tell how to connect to postgres database

  jpa:
    hibernate:
      ddl-auto: update # possible values : none, create, create-drop, update, validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect #it tells what syntax to user while generating SQL

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-make-it-long
  expiration: 900000 # 15 minutes in milliseconds

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173